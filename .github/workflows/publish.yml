name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Update module version in manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $psd1 = Get-Content .\IntuneLaps.psd1 -Raw
          $psd1 = $psd1 -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion     = '$version'"
          Set-Content .\IntuneLaps.psd1 -Value $psd1 -NoNewline

      - name: Stage module files
        shell: pwsh
        run: |
          $staging = "$env:RUNNER_TEMP\IntuneLaps"
          Copy-Item . -Destination $staging -Recurse -Force

          # Remove repo-only files and folders that should not be in the Gallery package
          Remove-Item "$staging\.agent"            -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\.github"           -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\.git"              -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\.vscode"           -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\Tests"             -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\CLAUDE.md"                  -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\README.md"                  -Force -ErrorAction SilentlyContinue
          Remove-Item "$staging\*.nuspec"                   -Force -ErrorAction SilentlyContinue

      - name: Publish to PowerShell Gallery
        shell: pwsh
        run: |
          Publish-Module -Path "$env:RUNNER_TEMP\IntuneLaps" -NuGetApiKey "${{ secrets.PSGALLERY_API_KEY }}" -Verbose
